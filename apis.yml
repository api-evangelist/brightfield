aid: brightfield
name: Brightfield
description: 'Brightfield is an extended-workforce intelligence company whose TDX
  (Talent Data Exchange) and TDX AI platform give enterprises data, automation, and
  precision over contingent-labor and statement-of-work (SOW) spending across 100+
  countries. Products include Rate Intelligence, Rate Card Manager, SOW Rate Insights,
  SOW Quality and Risk Analytics, Supplier Scorecard, and an ROI Dashboard, built on
  transaction-level data from 700+ companies and $500B+ of global spend. Founded and
  led by CEO Jason Ezratty and headquartered in Washington, DC, Brightfield is backed
  by Sapphire Ventures. The product is delivered as a login-gated SaaS application;
  no public developer API or documentation surface is published at this time.'
